<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Журнал и Заметки преподавателя</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .vertical-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div id="app" class="max-w-7xl mx-auto p-3 sm:p-6 space-y-4">
    
    <!-- Шапка управления -->
    <header class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700/60 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-bold text-white tracking-wide">Журнал & Заметки</h1>
          <span id="syncStatus" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Облако онлайн
          </span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Сетка расписания с прикрепленными задачами и синхронизацией</p>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnScheduleView" class="px-4 py-2 text-sm font-semibold rounded-xl bg-orange-600 text-white shadow-md shadow-orange-600/30 transition">Расписание</button>
        <button id="btnPresetsView" class="px-4 py-2 text-sm font-semibold rounded-xl bg-slate-700/70 text-slate-300 hover:bg-slate-700 transition">Группы и предметы</button>
      </div>
    </header>

    <!-- СЕКЦИЯ: СПРАВОЧНИК -->
    <section id="presetsSection" class="hidden bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-5">
      <h2 class="text-lg font-bold text-white border-b border-slate-700 pb-2">Справочник групп и предметов</h2>
      <form id="addPresetForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input id="inputGroup" type="text" placeholder="Шифр группы (напр. БПК-13)" required class="bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-orange-500" />
        <input id="inputSubject" type="text" placeholder="Дисциплина (напр. ОУД.05 Информатика)" required class="bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm outline-none focus:border-orange-500" />
        <button type="submit" class="bg-orange-600 hover:bg-orange-500 text-white rounded-xl p-3 text-sm font-semibold transition">Добавить в облако</button>
      </form>

      <div>
        <h3 class="text-sm font-semibold text-slate-400 mb-2">Сохраненные дисциплины:</h3>
        <ul id="presetsList" class="divide-y divide-slate-700/50 border border-slate-700 rounded-xl max-h-60 overflow-y-auto bg-slate-900/50"></ul>
      </div>
    </section>

    <!-- СЕКЦИЯ: КАЛЕНДАРЬ И ДНИ -->
    <main id="scheduleSection" class="space-y-4">
      <div class="bg-slate-800 p-3 rounded-2xl shadow-lg border border-slate-700/60 flex items-center justify-between">
        <button id="prevWeekBtn" class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs sm:text-sm font-semibold text-slate-200">← Пред. неделя</button>
        <div id="weekRangeLabel" class="text-sm font-bold text-orange-400 text-center tracking-wide"></div>
        <button id="nextWeekBtn" class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs sm:text-sm font-semibold text-slate-200">След. неделя →</button>
      </div>

      <!-- Мобильный селектор дней -->
      <div id="mobileDaySelector" class="flex lg:hidden bg-slate-800 p-1 rounded-xl border border-slate-700 gap-1 overflow-x-auto"></div>

      <!-- 5 карточек дней: адаптивно (1 колонка на мобильном, 5 на ПК/планшете) -->
      <div id="daysContainer" class="grid grid-cols-1 lg:grid-cols-5 gap-4 items-start"></div>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ЗАМЕТКИ / ДЕЛА -->
  <div id="taskModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <div>
          <h3 class="text-base font-bold text-white">Новая заметка / задача</h3>
          <p id="modalDateSubtitle" class="text-xs text-orange-400 mt-0.5"></p>
        </div>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white text-xl">✕</button>
      </div>

      <form id="createTaskForm" class="space-y-3">
        <input type="hidden" id="taskDateKey" />
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Привязка к паре</label>
          <select id="taskSlotIndex" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 outline-none focus:border-orange-500">
            <option value="-1">Заметка на весь день</option>
            <option value="0">К паре №1</option>
            <option value="1">К паре №2</option>
            <option value="2">К паре №3</option>
            <option value="3">К паре №4</option>
            <option value="4">К паре №5</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Заголовок *</label>
          <input id="taskTitle" type="text" placeholder="Напр. Провести проверочную работу" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-orange-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Описание / тема / детали</label>
          <textarea id="taskDesc" rows="2" placeholder="Заметки по материалу, список отсутствующих..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-orange-500"></textarea>
        </div>

        <!-- Приоритет (по вашим референсам) -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Приоритет</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" class="priority-btn py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-emerald-400" data-val="Low">Обычный</button>
            <button type="button" class="priority-btn py-2 text-xs font-bold rounded-xl border border-orange-500 bg-orange-600 text-white" data-val="Important">Важно</button>
            <button type="button" class="priority-btn py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-rose-400" data-val="Urgent">Срочно</button>
          </div>
          <input type="hidden" id="taskPriority" value="Important" />
        </div>

        <!-- Категория -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Категория</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" class="category-btn py-1.5 text-xs font-bold rounded-xl border border-indigo-500 bg-indigo-600 text-white" data-val="Work">Работа</button>
            <button type="button" class="category-btn py-1.5 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400" data-val="Study">Учёба</button>
            <button type="button" class="category-btn py-1.5 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400" data-val="Personal">Личное</button>
          </div>
          <input type="hidden" id="taskCategory" value="Work" />
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeTaskModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl text-xs font-semibold transition">Отмена</button>
          <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-emerald-600/30 transition">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://rlrvhutoqrvkzahwbbwv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscnZodXRvcXJ2a3phaHdiYnd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDYxMDUsImV4cCI6MjEwNDUyMjEwNX0.7R1paBBIYLdQcpKtRhdlvj_wYR-VGl0la04jjBgnSKk';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let presets = [];
    let schedule = {};
    let notes = {}; // ключ: "YYYY-MM-DD" -> массив заметок
    let currentMonday = getMonday(new Date());
    let activeMobileDayIndex = 0;

    const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница'];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const m = new Date(date.setDate(diff));
      m.setHours(0, 0, 0, 0);
      return m;
    }

    function formatDateKey(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDisplayDate(date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}.${m}.${y}`;
    }

    // Вкладки
    const btnSchedule = document.getElementById('btnScheduleView');
    const btnPresets = document.getElementById('btnPresetsView');
    const presetsSection = document.getElementById('presetsSection');
    const scheduleSection = document.getElementById('scheduleSection');

    btnSchedule.addEventListener('click', () => {
      btnSchedule.className = 'px-4 py-2 text-sm font-semibold rounded-xl bg-orange-600 text-white shadow-md shadow-orange-600/30 transition';
      btnPresets.className = 'px-4 py-2 text-sm font-semibold rounded-xl bg-slate-700/70 text-slate-300 hover:bg-slate-700 transition';
      presetsSection.classList.add('hidden');
      scheduleSection.classList.remove('hidden');
      renderSchedule();
    });

    btnPresets.addEventListener('click', () => {
      btnPresets.className = 'px-4 py-2 text-sm font-semibold rounded-xl bg-orange-600 text-white shadow-md shadow-orange-600/30 transition';
      btnSchedule.className = 'px-4 py-2 text-sm font-semibold rounded-xl bg-slate-700/70 text-slate-300 hover:bg-slate-700 transition';
      scheduleSection.classList.add('hidden');
      presetsSection.classList.remove('hidden');
      renderPresets();
    });

    // Загрузка данных
    async function initData() {
      // 1. Пресеты
      const { data: pData } = await db.from('presets').select('*').order('created_at', { ascending: true });
      if (pData) presets = pData.map(item => ({ id: item.id, group: item.group_name, subject: item.subject }));

      // 2. Расписание
      const { data: sData } = await db.from('schedule_slots').select('*');
      if (sData) {
        schedule = {};
        sData.forEach(row => {
          if (!schedule[row.date_key]) schedule[row.date_key] = [{}, {}, {}, {}, {}];
          schedule[row.date_key][row.slot_index] = {
            presetId: row.preset_id || '',
            isReplacement: row.is_replacement || false
          };
        });
      }

      // 3. Заметки
      const { data: nData } = await db.from('day_notes').select('*');
      if (nData) {
        notes = {};
        nData.forEach(item => {
          if (!notes[item.date_key]) notes[item.date_key] = [];
          notes[item.date_key].push(item);
        });
      }

      renderSchedule();
      renderPresets();

      // Подписка на обновления
      db.channel('all_sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_slots' }, (payload) => {
          const row = payload.new;
          if (row && row.date_key) {
            if (!schedule[row.date_key]) schedule[row.date_key] = [{}, {}, {}, {}, {}];
            schedule[row.date_key][row.slot_index] = {
              presetId: row.preset_id || '',
              isReplacement: row.is_replacement || false
            };
            renderSchedule();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'day_notes' }, async () => {
          const { data } = await db.from('day_notes').select('*');
          if (data) {
            notes = {};
            data.forEach(item => {
              if (!notes[item.date_key]) notes[item.date_key] = [];
              notes[item.date_key].push(item);
            });
            renderSchedule();
          }
        })
        .subscribe();
    }

    // Отрисовка расписания
    function renderSchedule() {
      const friday = new Date(currentMonday);
      friday.setDate(friday.getDate() + 4);
      document.getElementById('weekRangeLabel').textContent = 
        `${formatDisplayDate(currentMonday)} — ${formatDisplayDate(friday)}`;

      // Мобильная панель
      const mobileNav = document.getElementById('mobileDaySelector');
      mobileNav.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const btn = document.createElement('button');
        const isActive = i === activeMobileDayIndex;
        btn.className = `flex-1 py-2 px-2 rounded-xl text-xs font-bold text-center whitespace-nowrap transition ${
          isActive ? 'bg-orange-600 text-white shadow-md' : 'text-slate-400 bg-slate-850 hover:bg-slate-700'
        }`;
        btn.textContent = dayNames[i].slice(0, 2);
        btn.onclick = () => {
          activeMobileDayIndex = i;
          renderSchedule();
        };
        mobileNav.appendChild(btn);
      }

      const container = document.getElementById('daysContainer');
      container.innerHTML = '';

      for (let i = 0; i < 5; i++) {
        const dayDate = new Date(currentMonday);
        dayDate.setDate(dayDate.getDate() + i);
        const dateKey = formatDateKey(dayDate);
        const daySchedule = schedule[dateKey] || [{}, {}, {}, {}, {}];
        const dayNotesList = notes[dateKey] || [];

        const card = document.createElement('div');
        const isHiddenOnMobile = i !== activeMobileDayIndex ? 'hidden lg:flex' : 'flex';
        card.className = `${isHiddenOnMobile} flex-col bg-slate-800 rounded-2xl shadow-xl border border-slate-700/80 overflow-hidden`;

        // Шапка карточки дня (стиль эскиза)
        const dayHeader = document.createElement('div');
        dayHeader.className = 'bg-slate-750 p-3 border-b border-slate-700 flex justify-between items-center';
        dayHeader.innerHTML = `
          <div>
            <div class="text-xs font-bold text-orange-400 uppercase tracking-wider">${formatDisplayDate(dayDate)}</div>
            <div class="text-sm font-extrabold text-white">${dayNames[i]}</div>
          </div>
          <button onclick="openTaskModal('${dateKey}', -1)" title="Добавить заметку" class="w-7 h-7 flex items-center justify-center bg-orange-600/30 hover:bg-orange-600 text-orange-400 hover:text-white rounded-lg text-sm font-bold transition">
            +
          </button>
        `;

        // 5 пар
        const slotsContainer = document.createElement('div');
        slotsContainer.className = 'divide-y divide-slate-700/60 bg-slate-850';

        for (let slotIdx = 0; slotIdx < 5; slotIdx++) {
          const slot = daySchedule[slotIdx] || { presetId: '', isReplacement: false };
          const pairNotes = dayNotesList.filter(n => n.slot_index === slotIdx);

          const row = document.createElement('div');
          row.className = `p-2.5 flex flex-col justify-between transition-colors ${
            slot.isReplacement ? 'bg-amber-950/30 border-l-4 border-amber-500' : 'hover:bg-slate-800/50'
          }`;

          const topRow = document.createElement('div');
          topRow.className = 'flex items-center justify-between mb-1';
          topRow.innerHTML = `
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-extrabold text-slate-400">№${slotIdx + 1}</span>
              <button onclick="openTaskModal('${dateKey}', ${slotIdx})" title="Привязать заметку к паре" class="text-[10px] text-slate-500 hover:text-orange-400">📝</button>
            </div>
            <button 
              onclick="toggleReplacement('${dateKey}', ${slotIdx})" 
              class="text-[9px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wider transition ${
                slot.isReplacement 
                  ? 'bg-amber-500 text-slate-950 font-black' 
                  : 'bg-slate-750 text-slate-400 hover:bg-slate-700'
              }">
              ${slot.isReplacement ? 'Замена' : 'По плану'}
            </button>
          `;

          const select = document.createElement('select');
          select.className = 'w-full text-xs font-semibold text-slate-200 bg-transparent border-0 border-b border-transparent focus:border-orange-500 p-0.5 outline-none cursor-pointer truncate';
          
          let optionsHtml = '<option value="" class="bg-slate-800 text-slate-400">— Окно —</option>';
          presets.forEach(p => {
            const isSelected = slot.presetId === p.id ? 'selected' : '';
            optionsHtml += `<option value="${p.id}" ${isSelected} class="bg-slate-800 text-white">${p.group} — ${p.subject}</option>`;
          });
          select.innerHTML = optionsHtml;

          select.onchange = (e) => {
            updateSlotData(dateKey, slotIdx, e.target.value, slot.isReplacement);
          };

          row.appendChild(topRow);
          row.appendChild(select);

          // Отображение заметок, привязанных к конкретной паре
          if (pairNotes.length > 0) {
            const pairNotesBox = document.createElement('div');
            pairNotesBox.className = 'mt-1.5 space-y-1';
            pairNotes.forEach(n => {
              pairNotesBox.appendChild(createNoteBadge(n));
            });
            row.appendChild(pairNotesBox);
          }

          slotsContainer.appendChild(row);
        }

        // Блок заметок на весь день
        const dayGeneralNotes = dayNotesList.filter(n => n.slot_index === -1);
        const dayFooterNotes = document.createElement('div');
        dayFooterNotes.className = 'p-2.5 bg-slate-900/60 border-t border-slate-700/80 space-y-1.5';
        dayFooterNotes.innerHTML = `<div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Заметки дня:</div>`;

        if (dayGeneralNotes.length === 0) {
          dayFooterNotes.innerHTML += `<div class="text-[11px] text-slate-600 italic">Нет заметок</div>`;
        } else {
          dayGeneralNotes.forEach(n => {
            dayFooterNotes.appendChild(createNoteBadge(n));
          });
        }

        card.appendChild(dayHeader);
        card.appendChild(slotsContainer);
        card.appendChild(dayFooterNotes);
        container.appendChild(card);
      }
    }

    // Создание бейджа заметки в стиле референсов
    function createNoteBadge(note) {
      const el = document.createElement('div');
      const priorityColors = {
        Low: 'text-emerald-400 border-emerald-500/30 bg-emerald-950/40',
        Important: 'text-orange-400 border-orange-500/30 bg-orange-950/40',
        Urgent: 'text-rose-400 border-rose-500/30 bg-rose-950/40'
      };
      const color = priorityColors[note.priority] || priorityColors.Important;

      el.className = `p-1.5 rounded-lg border text-xs flex justify-between items-start gap-1 ${color} ${
        note.is_completed ? 'opacity-40 line-through' : ''
      }`;
      
      el.innerHTML = `
        <div class="flex-1 truncate">
          <span class="font-bold">${note.title}</span>
          ${note.description ? `<p class="text-[10px] opacity-80 truncate">${note.description}</p>` : ''}
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="toggleNoteComplete('${note.id}', ${!note.is_completed})" class="text-[10px] px-1 rounded bg-slate-800 hover:bg-slate-700 text-white">✓</button>
          <button onclick="deleteNote('${note.id}')" class="text-[10px] px-1 rounded bg-rose-950 hover:bg-rose-800 text-rose-300">✕</button>
        </div>
      `;
      return el;
    }

    // Логика модального окна заметок
    function openTaskModal(dateKey, slotIndex) {
      document.getElementById('taskDateKey').value = dateKey;
      document.getElementById('taskSlotIndex').value = slotIndex;
      document.getElementById('modalDateSubtitle').textContent = `Дата: ${dateKey} ${slotIndex >= 0 ? `(Пара №${slotIndex + 1})` : '(На весь день)'}`;
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDesc').value = '';
      document.getElementById('taskModal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
    }

    // Кнопки приоритета и категории
    document.querySelectorAll('.priority-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.priority-btn').forEach(b => {
          b.className = 'priority-btn py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400';
        });
        btn.className = 'priority-btn py-2 text-xs font-bold rounded-xl border border-orange-500 bg-orange-600 text-white';
        document.getElementById('taskPriority').value = btn.dataset.val;
      };
    });

    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.category-btn').forEach(b => {
          b.className = 'category-btn py-1.5 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400';
        });
        btn.className = 'category-btn py-1.5 text-xs font-bold rounded-xl border border-indigo-500 bg-indigo-600 text-white';
        document.getElementById('taskCategory').value = btn.dataset.val;
      };
    });

    // Сохранение новой заметки
    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dateKey = document.getElementById('taskDateKey').value;
      const slotIndex = parseInt(document.getElementById('taskSlotIndex').value, 10);
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDesc').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const category = document.getElementById('taskCategory').value;

      const newNote = {
        id: Date.now().toString(),
        date_key: dateKey,
        slot_index: slotIndex,
        title,
        description,
        priority,
        category,
        is_completed: false
      };

      if (!notes[dateKey]) notes[dateKey] = [];
      notes[dateKey].push(newNote);
      closeTaskModal();
      renderSchedule();

      await db.from('day_notes').insert([newNote]);
    });

    async function toggleNoteComplete(id, isCompleted) {
      for (const d in notes) {
        const item = notes[d].find(n => n.id === id);
        if (item) item.is_completed = isCompleted;
      }
      renderSchedule();
      await db.from('day_notes').update({ is_completed: isCompleted }).eq('id', id);
    }

    async function deleteNote(id) {
      for (const d in notes) {
        notes[d] = notes[d].filter(n => n.id !== id);
      }
      renderSchedule();
      await db.from('day_notes').delete().eq('id', id);
    }

    // Сохранение пар
    async function updateSlotData(dateKey, slotIndex, presetId, isReplacement) {
      if (!schedule[dateKey]) schedule[dateKey] = [{}, {}, {}, {}, {}];
      schedule[dateKey][slotIndex] = { presetId, isReplacement };

      const slotId = `${dateKey}_${slotIndex}`;
      await db.from('schedule_slots').upsert({
        id: slotId,
        date_key: dateKey,
        slot_index: slotIndex,
        preset_id: presetId,
        is_replacement: isReplacement,
        updated_at: new Date()
      });
    }

    async function toggleReplacement(dateKey, slotIndex) {
      if (!schedule[dateKey]) schedule[dateKey] = [{}, {}, {}, {}, {}];
      const currentSlot = schedule[dateKey][slotIndex] || { presetId: '', isReplacement: false };
      const nextStatus = !currentSlot.isReplacement;

      schedule[dateKey][slotIndex] = { ...currentSlot, isReplacement: nextStatus };
      renderSchedule();

      const slotId = `${dateKey}_${slotIndex}`;
      await db.from('schedule_slots').upsert({
        id: slotId,
        date_key: dateKey,
        slot_index: slotIndex,
        preset_id: currentSlot.presetId || '',
        is_replacement: nextStatus,
        updated_at: new Date()
      });
    }

    // Пресеты
    document.getElementById('addPresetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const groupInput = document.getElementById('inputGroup');
      const subjectInput = document.getElementById('inputSubject');
      const newPreset = {
        id: Date.now().toString(),
        group_name: groupInput.value.trim(),
        subject: subjectInput.value.trim()
      };
      await db.from('presets').insert([newPreset]);
      presets.push({ id: newPreset.id, group: newPreset.group_name, subject: newPreset.subject });
      groupInput.value = '';
      subjectInput.value = '';
      renderPresets();
    });

    async function deletePreset(id) {
      presets = presets.filter(p => p.id !== id);
      renderPresets();
      await db.from('presets').delete().eq('id', id);
    }

    function renderPresets() {
      const list = document.getElementById('presetsList');
      list.innerHTML = '';
      if (presets.length === 0) {
        list.innerHTML = '<li class="p-3 text-xs text-slate-500">Список пуст</li>';
        return;
      }
      presets.forEach(p => {
        const li = document.createElement('li');
        li.className = 'p-3 flex justify-between items-center text-xs hover:bg-slate-800';
        li.innerHTML = `
          <div><span class="font-bold text-white">${p.group}</span> — <span class="text-slate-400">${p.subject}</span></div>
          <button onclick="deletePreset('${p.id}')" class="text-rose-400 hover:text-rose-300 font-semibold">Удалить</button>
        `;
        list.appendChild(li);
      });
    }

    // Навигация
    document.getElementById('prevWeekBtn').onclick = () => {
      currentMonday.setDate(currentMonday.getDate() - 7);
      renderSchedule();
    };

    document.getElementById('nextWeekBtn').onclick = () => {
      currentMonday.setDate(currentMonday.getDate() + 7);
      renderSchedule();
    };

    initData();
  </script>
</body>
</html>
